# XcodeGen spec: `xcodegen generate` writes Kotora.xcodeproj (git-ignored). See ios/README.md.
name: Kotora
options:
  bundleIdPrefix: io.github.hanami117
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "500"
targets:
  Kotora:
    type: application
    platform: iOS
    sources:
      - path: Kotora
      # Inter: the Android app's copy (OFL), not duplicated.
      - path: ../android/app/src/main/res/font/inter_regular.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/inter_medium.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/inter_semibold.ttf
        buildPhase: resources
      - path: build/demo.db
        buildPhase: resources
        optional: true
    dependencies:
      - framework: build/KotoraCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hanami117.kotora.spike
        PRODUCT_NAME: Kotora
        INFOPLIST_FILE: Kotora/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # A free Apple ID's Personal Team goes here in Xcode (Signing & Capabilities).
        DEVELOPMENT_TEAM: ""
        OTHER_LDFLAGS: ["-lc++"]
