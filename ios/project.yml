# XcodeGen spec: `xcodegen generate` writes Kotora.xcodeproj (git-ignored). See ios/README.md.
# Bundle ids, Client IDs and the signing team are in Config/*.xcconfig.
name: Kotora
options:
  bundleIdPrefix: io.github.hanami117
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.2"
    CURRENT_PROJECT_VERSION: "502"
targets:
  Kotora:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Kotora
      # Inter: the Android app's copy (OFL), not duplicated.
      - path: ../android/app/src/main/res/font/inter_regular.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/inter_medium.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/inter_semibold.ttf
        buildPhase: resources
    dependencies:
      - framework: build/KotoraCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: Kotora
        INFOPLIST_FILE: Kotora/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: ["-lc++"]
