[package]
name = "kotora-ctl"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "kot: the command line for a running Kotora, and the control protocol it speaks"

[lib]
name = "kotora_ctl"
path = "src/lib.rs"

[[bin]]
name = "kot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# getuid; confstr for the macOS socket folder.
libc = "0.2"
