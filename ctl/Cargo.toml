[package]
name = "kotora-ctl"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "kot: the command line for a running Kotora, and the control protocol it speaks"

[lib]
name = "kotora_ctl"
path = "src/lib.rs"

[[bin]]
name = "kot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# getuid; confstr for the macOS socket folder.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The named pipe (`pipe.rs`). The same windows-sys Rune already builds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
