[workspace]
resolver = "3"
members = ["core", "detect", "app", "ctl"]

# The one version and license of every crate (and of the app: About, `--version`, the bundle).
[workspace.package]
version = "0.5.2"
license = "GPL-3.0-or-later"
repository = "https://github.com/hanami117/kotora"
edition = "2024"

# Rune is unusably slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

# One codegen unit: the stripped Linux x86_64 binary goes from 33.9 to 29.9 MB (the 30 MB budget), for about 30 s more on a full release build. No change in behaviour.
[profile.release]
codegen-units = 1
