[package]
name = "kotora"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "Kotora: a native anime tracker for Linux and macOS (Rune UI)"

[dependencies]
# Rune is pre-release: pin a rev of its dev branch. Same rev as Uzumaki; bump both apps together.
# Rune's default features minus `ogg-audio` (macOS Ogg playback; Kotora plays no sound).
# `dbus` is the Linux tray (StatusNotifierItem, `tray_linux.rs`; it also brings the light/dark
# portal); it adds zbus 6 and a tokio runtime on the tray's own thread. No effect on macOS.
rune = { git = "https://github.com/anomalyco/rune", rev = "f3d04f3f2069d177d04c963b0ba9f6b2065e46eb", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend", "svg"] }
kotora-core = { path = "../core" }
kotora-detect = { path = "../detect" }
# The `kot` protocol and socket (the app answers, `kot` asks).
kotora-ctl = { path = "../ctl" }
# Cover decoding at display size. Rune already builds this crate with these features, so it adds
# no code of its own (the same version and features, one copy in the tree).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# WebP covers (MAL serves some as `.webp`): the pure-Rust decoder alone (MIT OR Apache-2.0).
# `image`'s own `webp` feature links the encoder too: +0.56 MB stripped against +0.23 MB this way.
image-webp = "0.2"

# Linux notifications with buttons (`notes/linux.rs`): the zbus 5 that `kotora-detect` (MPRIS) and
# Rune's AT-SPI already build, same features. No new code.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

# Windows glue: the same windows-sys and windows crates Rune already builds.
# - `win.rs`: the console and log output, ShellExecute, the folder picker (COM), the screen's
#   work area and scale, the window's icon, the app id of the taskbar and the toasts.
# - `autostart_win.rs`: the Run key (registry).
# - `notes/windows.rs`: toast notifications (WinRT).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "Foundation_Collections", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

# macOS only, on the objc2 0.6 stack Rune already builds (no extra frameworks): the menu bar's
# About panel and app-menu tidy (menu_bar.rs) and the menu bar icon (tray_mac.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Notifications (`notes/mac.rs`): completion-handler blocks; block2 0.6 is already in the build.
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSDictionary", "NSData", "NSGeometry", "NSObject", "NSBundle", "NSError"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSImage", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView"] }

# The icon, version details and manifest of the Windows program (`build.rs`). Build-time only, and
# only when building on Windows: Linux and macOS never compile it.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }
