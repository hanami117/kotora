[package]
name = "kotora"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "Kotora: a native anime tracker for Linux and macOS (Rune UI)"

[dependencies]
# Rune is pre-release: pin a rev of its dev branch. Same rev as Uzumaki; bump both apps together.
# Rune's default features minus `ogg-audio` (macOS Ogg playback; Kotora plays no sound) and
# `dbus` (Linux: the light/dark portal, tray, global shortcuts and file dialogs, none used yet; it
# brought zbus 6 and a tokio runtime). The tray (v0.4) brings it back. AT-SPI accessibility keeps
# its own zbus.
rune = { git = "https://github.com/anomalyco/rune", rev = "f3d04f3f2069d177d04c963b0ba9f6b2065e46eb", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "svg"] }
kotora-core = { path = "../core" }
kotora-detect = { path = "../detect" }
# The `kot` protocol and socket (the app answers, `kot` asks).
kotora-ctl = { path = "../ctl" }
# Cover decoding at display size. Rune already builds this crate with these features, so it adds
# no code of its own (the same version and features, one copy in the tree).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# WebP covers (MAL serves some as `.webp`): the pure-Rust decoder alone (MIT OR Apache-2.0).
# `image`'s own `webp` feature links the encoder too: +0.56 MB stripped against +0.23 MB this way.
image-webp = "0.2"

# macOS only, on the objc2 0.6 stack Rune already builds (no extra frameworks): the menu bar's
# About panel and app-menu tidy (menu_bar.rs) and the menu bar icon (tray_mac.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSData", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSImage", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView"] }
