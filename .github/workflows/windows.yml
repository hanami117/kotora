# Windows build of Kotora (the port lives on the `windows` branch).
# Runs on a push to that branch and by hand. Nothing here signs or releases.
name: windows

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Stage 0: the real error list. Each step runs even when the one before failed.
      - name: cargo check
        id: check
        continue-on-error: true
        run: cargo check --workspace --all-targets --locked --keep-going

      - name: cargo build
        id: build
        continue-on-error: true
        run: cargo build --workspace --locked --keep-going

      - name: cargo test
        id: test
        continue-on-error: true
        run: cargo test --workspace --locked --no-fail-fast

      - name: Headless snap
        id: snap
        continue-on-error: true
        shell: pwsh
        env:
          RUNE_GPU_LOG: "1"
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          target\debug\kotora.exe --list-scenes
          target\debug\kotora.exe --snap out\home.png --scene home --size 1280x800 --scale 1
          if (-not (Test-Path out\home.png)) { throw "no snap written" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snaps
          path: out
          if-no-files-found: warn

      - name: Result
        if: always()
        shell: pwsh
        run: |
          "check: ${{ steps.check.outcome }}  build: ${{ steps.build.outcome }}  test: ${{ steps.test.outcome }}  snap: ${{ steps.snap.outcome }}"
          if ("${{ steps.check.outcome }}${{ steps.build.outcome }}${{ steps.test.outcome }}${{ steps.snap.outcome }}" -ne "successsuccesssuccesssuccess") { exit 1 }

  # Stage 0 probe: does Rune's headless snap work on the runner's stock software adapter (WARP)?
  # Rune's own example at the rev Kotora pins; no Kotora code. Removed once Kotora itself snaps here.
  rune-probe:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Fetch Rune at the pinned rev
        shell: pwsh
        run: |
          git init rune
          cd rune
          git remote add origin https://github.com/anomalyco/rune
          git fetch --depth 1 origin f3d04f3f2069d177d04c963b0ba9f6b2065e46eb
          git checkout FETCH_HEAD
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rune
      - name: Build and snap examples/hello
        shell: pwsh
        working-directory: rune
        env:
          RUNE_GPU_LOG: "1"
        run: |
          cargo build --locked -p hello
          New-Item -ItemType Directory -Force ..\out | Out-Null
          target\debug\hello.exe --snap ..\out\hello.png --size 800x600 --scale 1
          if (-not (Test-Path ..\out\hello.png)) { throw "no snap written" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rune-hello-snap
          path: out
          if-no-files-found: warn
