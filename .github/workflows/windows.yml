# Windows build of Kotora (the port lives on the `windows` branch).
# Runs on a push to that branch and by hand. Nothing here signs or releases.
name: windows

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

      - name: Release build
        run: cargo build --release --locked -p kotora -p kotora-ctl

      # Headless snaps with the program that ships. Kotora is a windowed program: the pipe makes
      # PowerShell wait for it and show its output. No GPU here, so Windows' software adapter draws.
      - name: Headless snaps
        shell: pwsh
        env:
          RUNE_GPU_LOG: "1"
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = "target\release\kotora.exe"
          & $exe --version | Out-Host
          & $exe --list-scenes | Measure-Object -Line | Out-Host
          foreach ($scene in "home-covers", "list-covers", "list-grid-covers", "now-playing-offer", "setup-sign-in", "list-editor") {
            & $exe --snap "out\$scene.png" --scene $scene --size 1280x800 --scale 1 2>&1 | Out-Host
            if (-not (Test-Path "out\$scene.png")) { throw "no snap for $scene" }
          }
          Get-ChildItem out | Format-Table Name, Length | Out-Host

      # kot with no app running: it must say so, not hang or crash.
      - name: kot without the app
        shell: pwsh
        run: |
          $said = & target\release\kot.exe status 2>&1 | Out-String
          $said
          if ($LASTEXITCODE -eq 0) { throw "kot status succeeded with no app running" }
          if ($said -notmatch "running") { throw "unexpected answer" }
          exit 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snaps
          path: out
          if-no-files-found: warn

      # The download is Kotora-windows-x64.zip: the two programs, the notes and the licence.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\kotora.exe, target\release\kot.exe, packaging\windows\README-WINDOWS.txt, LICENSE dist
          Rename-Item dist\LICENSE LICENSE.txt
          Get-ChildItem dist | Format-Table Name, Length | Out-Host

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kotora-windows-x64
          path: dist
          if-no-files-found: error
