org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Client IDs of Kotora's own MyAnimeList and AniList clients for Android (public by design: PKCE
# `plain` with no secret, and AniList's implicit grant). Empty: this build can't sign in (the
# sign-in page says so). Override for a local build with -Pkotora.malClientId=... or the
# KOTORA_ANDROID_MAL_CLIENT_ID / KOTORA_ANDROID_ANILIST_CLIENT_ID environment variables.
kotora.malClientId=
kotora.anilistClientId=
