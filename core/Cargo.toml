[package]
name = "kotora-core"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "Kotora's core: data model, store, services, sync queue and recognition (no UI)"

# `desktop` (on by default): what only the desktop app needs: recognition (anitomy), the library
# scan, the loopback sign-in page, Discord, the update check and reading detection. Kotora for
# Android (`mobile/`) builds the core with `default-features = false`: lists, store, queue, sync,
# mirror, the services, Airing and Publishing.
[features]
default = ["desktop"]
desktop = ["dep:anitomy-ng"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2", default-features = false, features = ["std", "serde", "parse"] }
# Edits of config.toml keep the user's comments and layout (values over several lines too).
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# SQLite is compiled in (bundled): the same on Arch and macOS, no system library.
rusqlite = { version = "0.41", features = ["bundled"] }
# Blocking HTTP on worker threads (no async runtime of our own).
ureq = "3"
# File-name parsing (recognition): a pure-Rust port of anitomy, MPL-2.0 (decided
# 2026-11-15). It brings `regex` without its Unicode tables and fast paths.
anitomy-ng = { version = "1.0.10", default-features = false, optional = true }
# MyAnimeList XML export and import (`listxml.rs`): MyAnimeList ships its export gzipped. Both
# are already in the tree (rune's SVG stack); MIT / Apache-2.0.
flate2 = "1"
roxmltree = "0.20"

# The user's UTC offset (`localtime_r`, `tm_gmtoff`) for the airing times: the system's zone
# data instead of a time zone crate. Already in the tree (ureq, rusqlite).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The same on Windows (`time.rs`): the system's time zone rules; and random bytes for the
# sign-in (`mal.rs`). The windows-sys Rune already builds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Time"] }
